 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        .container{
            max-width: 800px;
            margin: 0 auto;
        }

        body{
            background-color: #eee;
            font-family: Arial, sans-serif;
            margin: 10px;
        }

        .card-container{
            margin: 14px 4px;
            display: grid;
            gap: 20px;
            align-items: center;
            justify-content: center;

            grid-template-columns: repeat(2,380px);
            grid-template-rows: repeat(2, 140px);
        }

        .card{
            background: white;
            display: flex;
            flex-direction: column;
            padding: 10px 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            height: 120px;
            justify-content: center;
        }

        h3{
            color: #5c5c5c;
        }

        .detail{
            font-size: 32px;
            font-weight: bold;
            margin-top: 24px;
        }
    </style>
 </head>
 <body>
    <div class="container">
        <h1>관리자 대시보드</h1>
        <div class="card-container">
            <div class="card">
                <h3>전체 수강생</h3>
                <p class="detail">128명</p>
            </div>

            <div class="card">
                <h3>오늘 출석률</h3>
                <p class="detail">92%</p>
            </div>

            <div class="card">
                <h3>미납 수강생</h3>
                <p class="detail">7명</p>

            </div>

            <div class="card">
                <h3>상담 예약</h3>
                <p class="detail">12건</p>
            </div>
        </div>
    </div>
 </body>
 </html>
