<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    *{
        margin: 0;
        padding: 0;
    }

    h2{
        margin: 20px;
    }

    /* 🎨 CSS 스타일 조건 */
    
    /* 기본 카드 스타일:

    모든 카드는 배경색 #f8f9fa, 테두리 1px solid #dee2e6, 둥근 모서리 12px, 안쪽 여백(padding) 20px를 가집니다. */
    .user-list{
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin: 20px;
    }
    
    .card{
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 12px;
        padding: 20px;
        max-width: 300px;
        line-height: 1.6;
    }

    .input-set{
        margin-top: 16px;
    }

    /* 구조 의사 클래스 활용:

    유저 리스트(div.user-list)의 첫 번째 카드는 중요 유저이므로 테두리 색상을 #3498db(파란색)로 변경하고 두께를 2px로 강조하세요. (:first-child 활용)

    두 번째 카드는 배경색을 #fffcf0(연한 노란색)으로 변경하세요. (:nth-child 활용) */

    .card:first-child{
        border: 2px solid #3498db;
    }

    .card:nth-child(2){
        background: #fffcf0;   
    }

    /* 멀티 클래스 선택자 활용:

    역할 배지(span.role-badge)는 기본적으로 글자 크기 14px,
     안쪽 여백 4px 8px, 둥근 모서리 4px를 가집니다. */

    .role-badge{
        font-size: 14px;
        padding: 4px 8px;
        border-radius: 4px;
        color: #fff;
    }

    /* 역할 배지에 멀티 클래스를 적용합니다. */

    /* 관리자 카드에는 role-badge와 admin 클래스를
     동시에 부여하고, 배경색 #e74c3c(빨간색), 글자색 #ffffff로
     지정하세요. (.role-badge.admin 선택자 사용) */

    .role-badge.admin{
        background-color: #e74c3c;
    }

    /* 일반 회원 카드에는 role-badge와 member 클래스를
     동시에 부여하고, 배경색 #2ecc71(초록색), 글자색 #ffffff로
      지정하세요. (.role-badge.member 선택자 사용) */
    
    .role-badge.member{
        background-color: #2ecc71;
    }

    /* 동적 및 상태 의사 클래스 활용: */

    /* 사용자가 마우스를 카드(div.card) 위에 올렸을 때(:hover),
     카드의 배경색을 #e9ecef로 변경하고
     마우스 커서 모양을 손가락 모양(cursor: pointer)으로
     바꾸세요. */
    .card:hover{
        background: #e9ecef;
        cursor: pointer;
    }

     /* 각 카드 안의 체크박스가 선택(체크)된 상태가 되면,
     해당 체크박스 바로 뒤에 있는 라벨(label)의 글자 색상을
     #9b59b6(보라색)으로 바꾸고
     글자 두께를 두껍게(font-weight: bold) 변경하세요.
     (인접 형제 선택자 +와 :checked 활용) */

    input:checked + label{
        color: #9b59b6;
        font-weight: bold;
    }

    </style>
</head>
<body>

    <!-- HTML 구조 조건
    전체 카드를 감싸는 부모 컨테이너(div.user-list)를 생성합니다.

    부모 컨테이너 내부에는 총 3개의 유저 카드 요소(div.card)를 작성합니다.

    각 카드 내부에는 아래의 요소들이 순서대로 포함되어야 합니다.

    유저 이름을 나타내는 제목 태그 (h3.user-name)

    유저의 역할을 나타내는 배지 태그 (span.role-badge)

    '선택' 기능을 하는 체크박스 태그와 라벨 태그 (input[type="checkbox"], label)

    주의: input 태그의 id 속성과 label 태그의 for 속성을 서로 일치시켜 연결하세요. -->

    <h2>유저 관리 대시보드</h2>
    <div class="user-list">
        <div class="card">
            <h3 class="user-name">홍길동 대리</h3>
            <span class="role-badge admin">관리자</span>
            <div class="input-set">
                <input type = "checkbox" id="select1">
                <label for="select1">현재 작업 멤버로 선택</label>
            </div>
        </div>


        <div class="card">
            <h3 class="user-name">이영희 사원</h3>
            <span class="role-badge member">일반 회원</span>
            <div class="input-set">
                <input type = "checkbox" id="select2">
                <label for="select2">현재 작업 멤버로 선택</label>
            </div>
        </div>


        <div class="card">
            <h3 class="user-name">김철수 사원</h3>
            <span class="role-badge member">일반 회원</span>
            <div class="input-set">
                <input type = "checkbox" id="select3">
                <label for="select3">현재 작업 멤버로 선택</label>
            </div>
        </div>
    </div>
</body>
</html>
