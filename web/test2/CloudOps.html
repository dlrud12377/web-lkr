<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        nav{
            display: flex;
            padding: 20px;
            justify-content: space-between;
            align-items: center;
        }

        .logo{
            font-family: 'Open Sans', sans-serif;
            font-weight: 800;
        }

        nav a{
            text-decoration: none;
            color: #475569;
            font-weight: bold;
        }

        .gnb_link{
            display: flex;
            gap: 20px;
        }

        .gnb_link--active{
            color: #3498db;
        }

        .gnb__btn{
            background: white;
            padding: 8px;
            width: 120px;
            border: 2px solid #3498db;
            border-radius: 6px;
            color: #3498db;
        }

        .hero{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: #f8fafc;
        }

        .features{
            background: #fff;
        }

        .pricing{
            background: #f8fafc;
        }

        .hero_btngroup{
            display: flex;
            gap: 10px;
        }
        
        .hero__btn1{
            color: white;
            background-color: #3498db;
            padding: 8px 12px;
            border:none;
            border-radius: 4px;
            cursor: pointer;
        }

        .hero__btn1:hover{
            background-color: #2876aa;
        }

        .hero__btn2{
            padding: 8px 6px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .hero__btn2:hover{
            background-color: #949494;
        }


    </style>
</head>
<body>
    <nav class="gnb">
        <div class="logo">CloudOps</div>
        <div class="gnb_link">
            <a href="#" class="gnb_link--active">제품 기능</a>
            <a href="#">사용법</a>
            <a href="#">가격선택</a>
            <a href="#">고객센터</a>
        </div>
        <button class="gnb__btn">무료 시작하기</button>
    </nav>

    <header class="hero">
        <h2>클라우드 인프라 관리를<br>
            더 안전하고 완벽하게</h2>
        <p>복잡한 설정 없이 몇 번의 클릭만으로 모니터링, 보안, 배포를 자동화하세요. 전 세계 1만 개 이상의 개발팀이<br>
             신뢰합니다.</p>
        <div class="hero_btngroup">
            <button class="hero__btn1">도입 문의하기</button>
            <button class="hero__btn2">데모 보기</button>
        </div>
    </header>

    <main>

        <section class="features">

        </section>

        <section class="pricing">

        </section>

    </main>
</body>
</html>
