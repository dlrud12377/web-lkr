<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1{
            font-size: 24px;
            padding-left: 4px;
        }

        body{
            background-color: #f5f6f8;
            font-family: sans-serif;
            padding: 40px;
        }

        .board-container{
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .board-header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding : 8px;
        }

        .search-box{
            padding: 8px 12px;
            border: 2px solid #ccc;
            border-radius: 4px;
            width: 200px;
        }

        .write-btn{
            padding:8px 16px;
            background: #2d6a4f;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .header-actions{
            display: flex;
            gap: 8px;
        }

        .board-table{
            width: 100%;
            border-collapse: collapse;
        }

        .board-table th{
            background-color : #f1f3f5;
            font-size: 14px;
            padding : 12px;
            border-bottom : 1px solid #ddd;
            text-align: center;
        }

        .board-table td{
            font-size: 14px;
            padding: 14px 12px;
            border-bottom: 1px solid #eee;
            text-align: center;

        }

        .board-table tr{
            display: flex;
        }

        .no-cell{
            flex: 1;
        }

        .title-cell{
            text-align: left !important;
            flex: 3;
        }

        .author-cell{
            flex: 1;
        }

        .date-cell{
            flex: 1;
        }

        .views-cell{
            flex: 1;
        }

        .pagination{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding : 20px 24px;
        }

        .page-btn{
            padding: 6px 12px;
            border: 1px solid #ddd;
            background: white;
            font-size: 13px;
            border-radius: 4px;
        }

        .active{
            background: #2d6a4f;
            color: white;
        }
    </style>

</head>
<body>
    <!--  헤더 영역
    상단 영역은 header 태그로 작성한다.
    header의 클래스명은 board-header로 지정한다.
    게시판 제목은 h1 태그로 작성한다.
    제목 내용은 다음과 같이 작성한다. -->

    <!-- 제목의 클래스명은 board-title로 지정한다.
    검색창과 글쓰기 버튼을 감싸는 div를 만들고 클래스명은 header-actions로 지정한다.
    검색창은 input type="text"로 작성한다.
    검색창의 클래스명은 search-box로 지정한다.
    검색창의 안내 문구는 제목을 검색하세요로 작성한다.
    글쓰기 버튼은 button 태그로 작성한다.
    글쓰기 버튼의 클래스명은 write-btn으로 지정한다.
    버튼 내용은 글쓰기로 작성한다. -->

    <div class="board-container">

    <header class="board-header">
        <h1 class="board-title">📌 자유게시판</h1>
        <div class="header-actions">
            <input class="search-box" type="text" placeholder="제목을 입력하세요">
            <button class="write-btn">글쓰기</button>
        </div>
    </header>


    <!-- 게시글 목록 제목 영역
    게시글 목록의 제목 행을 div로 작성한다.
    클래스명은 list-header로 지정한다.
    목록 제목은 span 태그로 작성한다.
    목록 제목은 다음 순서로 작성한다.
    번호 / 제목 / 작성자 / 작성일 / 조회수
    각 span에는 다음 클래스명을 지정한다.
    col-no
    col-title
    col-author
    col-date
    col-views -->
    <section>
        <table class="board-table">
        <thead>
            <tr>
                <th class="no-cell">번호</th>
                <th class="title-cell">제목</th>
                <th class="author-cell">작성자</th>
                <th class="date-cell">작성일</th>
                <th class="views-cell">조회수</th>
            </tr>
        </thead>

        <tr class="post-row">
            <td class="no-cell">5</td>
            <td class="title-cell"><a>도서관 휴관 안내 (6월 25일)</a></td>
            <td class="author-cell">관리자</td>
            <td class="date-cell">2026-06-18</td>
            <td class="views-cell">128</td>
        </tr>

        <tr class="post-row">
                <td class="no-cell">4</td>
                <td class="title-cell"><a>신간 도서 입고 안내드립니다</a></td>
                <td class="author-cell">관리자</td>
                <td class="date-cell">2026-06-15</td>
                <td class="views-cell">96</td>
        </tr>
            <tr class="post-row">
                <td class="no-cell">3</td>
                <td class="title-cell"><a>스터디룸 예약 방법 문의드립니다</a></td>
                <td class="author-cell">김도윤</td>
                <td class="date-cell">2026-06-12</td>
                <td class="views-cell">54</td>
            </tr>
            <tr class="post-row">
                <td class="no-cell">2</td>
                <td class="title-cell"><a>반납 연체료 관련 질문있어요</a></td>
                <td class="author-cell">이서연</td>
                <td class="date-cell">2026-06-10</td>
                <td class="views-cell">41</td>
            </tr>
            <tr class="post-row">
                <td class="no-cell">1</td>
                <td class="title-cell"><a>전자책 대출 서비스 오픈했습니다</a></td>
                <td class="author-cell">관리자</td>
                <td class="date-cell">2026-06-05</td>
                <td class="views-cell">203</td>
            </tr>
        </table>
    </section>

    <!-- 게시글 목록 영역
    게시글 목록을 감싸는 div를 만들고 클래스명은 post-list로 지정한다.
    게시글 한 줄은 div로 작성하고 클래스명은 post-row로 지정한다.
    게시글은 5개 작성한다.
    각 게시글은 다음 항목을 포함해야 한다.
    번호
    제목
    작성자
    작성일
    조회수
    게시글 제목은 a 태그로 작성한다.
    게시글 예시는 다음 내용을 사용한다.
    5 / 도서관 휴관 안내 (6월 25일) / 관리자 / 2026-06-18 / 128
    4 / 신간 도서 입고 안내드립니다 / 관리자 / 2026-06-15 / 96
    3 / 스터디룸 예약 방법 문의드립니다 / 김도윤 / 2026-06-12 / 54
    2 / 반납 연체료 관련 질문있어요 / 이서연 / 2026-06-10 / 41
    1 / 전자책 대출 서비스 오픈했습니다 / 관리자 / 2026-06-05 / 203 -->


    <!-- 페이지 번호 영역
    페이지 번호 영역은 div로 작성한다.
    클래스명은 pagination으로 지정한다.
    페이지 버튼은 button 태그로 작성한다.
    버튼은 다음 순서로 작성한다.
    이전 1 2 3 4 5 다음
    모든 버튼에는 page-btn 클래스를 지정한다.
    현재 페이지인 1 버튼에는 active 클래스를 추가한다.  -->

    </div>
</body>
</html>
