<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        h2{
            font-size: 20px;
        }

        body{
            background-color: #F5F6F8;
            display: flex;
            text-align: center;
            justify-content: center;
            padding: 20px 0;
        }

        .gallery-container{
            width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
            justify-content: center;
        }

        .card-list{
            display: flex;
            justify-self: center;
            gap: 16px;
        }

        .card{
            display: flex;
            flex-direction: column;
            text-align: left;
            width: 300px;
            background-color: white;
            padding: 14px;
            border: 1px solid #ddd;
            line-height: 2.0;
        }

        button{
            width: 100px;
            padding: 12px 8px;
            border: none;
            background-color: #2d6a4f;
            color:white;
            border-radius: 2px;
            font-size: 15px;
            cursor: pointer;
        }

        img{
            width: 100%;
            height: 198px;
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <h1>갤러리</h1>
        <div class="card-list">
            <div class="card">
                <img src="spring.jpg" alt="봄 풍경">
                <h2>봄 풍경</h2>
                <p>따뜻한 봄날의 풍경입니다.</p>
                <button>자세히 보기</button>
            </div>

            <div class="card">
                <img src="summer.jpg" alt="여름 풍경">
                <h2>여름 바다</h2>
                <p>시원하고 푸른 여름 바다입니다.</p>
                <button>자세히 보기</button>
            </div>

            <div class="card">
                <img src="autumn.jpg" alt="가을 풍경">
                <h2>가을 단풍</h2>
                <p>붉게 물든 가을 단풍 풍경입니다.</p>
                <button>자세히 보기</button>
            </div>
        </div>

    </div>
</body>
</html>
