<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* p태크에 두께 : 1px 스타일 : solid 색깔 : black */
        p {
            border : 1px solid black;
            width : 500px;
            height : 500px;
        }

        /* 배경 스타일 주기
        background-color : 색상지정(ex.green), 헥스값(#93867f), rgb(ex.rgb(0,120,255))값 모두 가능 */
        .b1{background-color: #3498db;}

        /* 배경 이미지
        background-image : url(경로)
        background-repeat : repeat 배경 이미지 반복 */
        .b2{background-image: url("cat.jpg");
            background-repeat: repeat;}

        /* 배경 이미지 위치
        background-position : center, right, left, top, bottom */
        .b3{background-image: url("cat.jpg");
            background-repeat: no-repeat;
            background-position: center;}

        /* 배경 축약 속성
        색상, 이미지, 반복, 위치를 한 번에 지정 가능 */
        .b4{
            background:url("cat.jpg") skyblue no-repeat center
        }

        /* 그라데이션 주는법 
        기본 방향이 위에서 아래
        바꾸려면 각도방향 속성을 넣어주어야 함
        */
        .d1{
            width: 500px;
            height: 500px;
            background:linear-gradient(pink,#ffffff)
        }
        
        .d2{
            width: 500px;
            height: 500px;
            background:linear-gradient(45deg,pink,#ffffff)
        }

        .d3{
            width: 500px;
            height: 500px;
            background:linear-gradient(to left,pink,#ffffff)
        }
    </style>
</head>
<body>
    <p class="b1">안녕하세요 반갑습니다 css 공부중입니다</p>
    <p class="b2">안녕하세요 반갑습니다 css 공부중입니다</p>
    <p class="b3">안녕하세요 반갑습니다 css 공부중입니다</p>
    <p class="b4">안녕하세요 반갑습니다 css 공부중입니다</p>
    <div class="d1"></div>
    <div class="d2"></div>
    <div class="d3"></div>
</body>
</html>
