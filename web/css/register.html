<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #F5F6F8;
            display: flex;
            justify-content: center;
            height: 100vh;
            align-items: center;
        }

        .register-container{
            width: 500px;
            display: flex;
            flex-direction: column;
            background-color: white;
            border: 1px solid #DDD;

        }

        .register-container h2{
            text-align: center;
            font-weight: 600;
        }

        .form-row{
            display: flex;
            margin: 8px;
        }

        button{

            padding: 10px 4px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }

        .button-group{
            display: flex;
            justify-content: center;
            padding: 10px;
            gap: 8px;
        }

        .b1{
            width: 70px;
            border : 1px solid #CCC;

        }

        .b2{
            color: white;
            background-color: #326E50;
            width: 100px;
        }
        
        .b3{
            width: 80px;
            background-color: white;
            border: 1px solid #DDD;
        }

        label[id="id"], label[id="password"]{
            flex: 1;
        }

        .detail{
            flex: 3;
        }

        input[type="text"], input[type="password"]{
            padding: 8px;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>회원가입</h2>
        <div class="form-row">
            <label for="id">
                아이디
            </label>
            <div class="detail">
                <input type="text" id="id" placeholder="아이디를 입력하세요">
                <button class="b1">중복확인</button>
            </div>
        </div>
        <div class="form-row">
            <label for="password">
                비밀번호
            </label>
            <div class="detail">
                <input type="password" id="password" placeholder="비밀번호를 입력하세요">
            </div>
        </div>
        <div class="form-row">
            <label for="email">
                이메일
            </label>
            <div class="detail">
            <input type="text" id="email" placeholder="이메일 아이디">@
            <select>
                <option>naver.com</option>
                <option>gmail.com</option>
                <option>daum.net</option>
            </select>
            </div>
        </div>
        <div class="form-row">
            <label for="address">
                주소
            </label>
            <div class="detail">
                <input type="text" id="address" placeholder="주소를 입력하세요">
            </div>
        </div>
        <div class="form-row">
            <label for="gender">성별</label>
            <input type="radio" name="gender" id="man">
            <label for="man">남성</label>
            <input type="radio" name="gender" id="woman">
            <label for="woman">여성</label>
        </div>
        <div class="button-group">
            <button class="b2">회원가입</button>
            <button class="b3">취소</button>
        </div>
    </div>
</body>
</html>
