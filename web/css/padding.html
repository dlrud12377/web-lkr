<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* box
        너비 200
        margin-bottom : 20px
        배경색 #74b9ff
        글씨색 흰색
        테두리 2px solid #0984e3 */
        .box{
            width: 200px;
            margin-bottom: 20px;
            background-color: #74b9ff;
            color: white;
            border: 2px solid #0984e3;
            
        }
        /* body
        배경색 #f7f9fc
        내부여백 20px */
        body{
            background-color: #f7f9fc;
            padding: 20px;
        }

        .padding-top{
            padding-top: 30px;
        }

        .padding-right{
            padding-right: 30px;
            text-align: right;
        }

        .padding-left{
            padding-left: 30px;
            text-align: left;
        }

        .padding-bottom{
            padding-bottom: 30px;
        }

        .padding-all{
            padding : 30px;
            text-align: center;
        }

        .padding-four{
            padding: 10px 20px 30px 40px;
        }
    </style>
</head>
<body>
    <!-- padding
     테두리와 내용 사이의 여백
     padding : 네 방향의 여백을 한 번에 지정할 수 있다.
     padding : 10px 상, 하, 좌, 우
     padding : 10px 20px 상하 / 좌우
     padding : 10px 20px 30px 상 / 좌우 / 하
     padding : 10px 20px 30px 40px 상 / 우 / 하 / 좌(시계방향) -->

     <div class = "box padding-top">box padding-top</div>
     <div class = "box padding-right">box padding-right</div>
     <div class = "box padding-left">box padding-left</div>
     <div class = "box padding-bottom">box padding-bottom</div>
     <div class = "box padding-all">box padding-all</div>
     <div class = "box padding-four">box padding-four</div>
</body>
</html>
