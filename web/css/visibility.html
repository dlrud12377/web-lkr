<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
            background-color: seagreen;
            margin-bottom: 20px;
            color: white;
            text-align: center;
        }

        /* 공간은 그대로 차지한다.
        클릭이 되지 않는다.
        transition이 제한적이다. */
        .hidden{
            visibility: hidden;
        }

        /* none의 경우 자리도 차지하지 않음 */
        .none{
            display: none;
        }

        /* opacity:0의 경우 보이지만 않고
        모든 기능이 원활하게 작동 */
        .invisible{
            opacity: 0;
            cursor: pointer;
        }

        .card{
            width: 300px;
            padding: 24px;
            background-color: #e9ffea;
            border-radius: 16px;
            border: 1px solid #c5f8d6;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.08);
        }

        .card p{
            color: #555;
        }

        .notice{
            margin-top: 20px;
            padding: 16px;
            background-color: rgb(123, 240, 143);
            color: white;
            border-radius: 10px;
            text-align: center;

            /* 애니메이션은 중간값이 있어야 자연스럽게 나온다. -> opacity 필요
            opacity만 쓰면 안보여도 클릭이 되버린다. -> visibility 적용이 필요
            그렇기 때문에 둘을 같이 사용해야 자연스럽고 사용 목적을 해치지 않는 버튼을 만들 수 있다.
            display:none은 아예 없는 판정이 되어버려 계획한 서식이 틀어질 가능성이 있으므로 사용 x */
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s linear;
        }

        .card:hover .notice{
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>
    <!-- visibility
     요소를 보이게 할지 숨길지 정하는 속성
     visible
     hidden -->
    <div class="box">1</div>
    <div class="box hidden">2</div> <!-- 숨겨진 박스 -->
    <div class="box">3</div>
    <div class="box none">4</div>
    <div class="box">5</div>
    <div class="box invisible">6</div>
    <div class="box">5</div>

    <hr>

    <div class="card">
        <h2>수강 신청</h2>
        <p>마우스를 카드 위에 올리면 안내 문구가 나타납니다.</p>
        <div class="notice">
            현재 조기 등록 할인 기간입니다.
        </div>
    </div>


</body>
</html>
