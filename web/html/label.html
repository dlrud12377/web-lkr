<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- label 태그
     입력 요소의 설명(이름표)을 붙여주는 태그 -->

     <!-- 체크박스 -->
     <label>
       HTML <input type = "checkbox" >
     </label>

     <br>

     <!-- 라디오버튼 -->
     <label>
       남자 <input type = "radio" name="gender">
     </label>
     <label>
       여자 <input type = "radio" name="gender">
     </label>

     <br>

     <!-- label에 for 속성을 지정해서 사용하는 방법
        for와 id가 서로 연결된다.
        브라우저는 label이 이름 입력창이라고 이해한다.-->

     <label for = "username" >
        이름
     </label>

     <br>

     <input type="text" id="username">
</body>
</html>
