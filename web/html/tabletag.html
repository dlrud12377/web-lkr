<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- <table> ~ </table> : 테이블을 만들어주는 태그
     <tr> : 행을 만들어주는 태그
     <td> : 열을 만들어주는 태그
     <th> : 테이블 헤더로 테이블 각 열을 대표하는 셀 -->
    
    <!-- 1*1 테이블 -->
    <table border="1">
        <tr>
            <td>1행 1열</td>
        </tr>
    </table>

    <hr>

    <!-- 1*2 테이블 -->
    <table border="1">
        <tr>
            <td>1행 1열</td>
            <td>1행 2열</td>
        </tr>
    </table>

    <hr>

    <!-- 2*1 테이블 -->
    <table border="1">
        <tr>
            <td>1행 1열</td>
        </tr>

        <tr>
            <td>2행 1열</td>
        </tr>
    </table>

    <hr>

    <!-- 2*2 테이블 -->
    <table border="1">
        <tr>
            <td>1행 1열</td>
            <td>1행 2열</td>
        </tr>

        <tr>
            <td>2행 1열</td>
            <td>2행 2열</td>
        </tr>
    </table>

    <hr>

    <!-- 열 합치기 -->
         <table border="1">
        <tr>
            <td colspan="3" align="center">메뉴판</td>
        </tr>
        <tr>
            <td>짜장면</td>
            <td>짬뽕</td>
            <td>탕수육</td>
        </tr>
    </table>

<hr>

    <!-- 행 합치기 -->
         <table border="1">
        <tr>
            <td rowspan="2">메뉴판</td>
            <td>짜장면</td>
        </tr>
        <tr>
            <td>짬뽕</td>
        </tr>
    </table>

<hr>

    <table border="1">
        <thead>
            <tr>
                <th>이름</th>
                <th>과목</th>
                <th>점수</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>김철수</td>
                <td>HTML</td>
                <td>90</td>
            </tr>

            <tr>
                <td>이영희</td>
                <td>CSS</td>
                <td>95</td>
            </tr>

            <tr>
                <td>박민수</td>
                <td>JS</td>
                <td>70</td>
            </tr>            
        </tbody>

        <!-- 표의 맨 아래 요약 정보를 작성한다.
         합계, 평균, 결과, 통계 -->
        <tfoot>
            <td colspan="2">평균 점수</td>
            <td>85</td>
        </tfoot>

    </table>
</body>
</html>
