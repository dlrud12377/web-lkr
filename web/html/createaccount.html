<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>회원 등록</h2>

    <p>
        <label for="firstname">First Name</label><br>
        <input type="text" id="firstname">
    </p>
    
    <p>
        <label for="lastname">Last Name</label><br>
        <input type="text" id="lastname">
    </p>

    <p>
        <label for="email">Email</label><br>
        <input type="text" id="email">
    </p>

    <p>
        Gender<br>
        <input type="radio" id="male" name = "gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name = "gender" value="female">
        <label for="female">Female</label>
    </p>

    <p>
        Favorite Language<br>
        <input type="checkbox" id="HTML" name = "language">
        <label for="HTML">HTML</label>
        <input type="checkbox" id="Java" name = "language">
        <label for="Java">Java</label>
        <input type="checkbox" id="PHP" name = "language">
        <label for="PHP">PHP</label>
    </p>

    <p>
        University<br>
        <select name="University">
            <option>대학교 선택</option>
            <option value = "OO">ㅇㅇ대학교</option>
            <option value = "XX">XX대학교</option>
            <option value = "@@">@@대학교</option>
        </select>
    </p>

    <p>
        <label for = "color">Favorite Color</label><br>
        <input type="color" id="color">
    </p>

    <p>
        <label for="birthDate">Birth Date</label><br>
        <input type="date" id="birthDate">
    </p>

    <button type="submit">Registration</button>
</body>
</html>
