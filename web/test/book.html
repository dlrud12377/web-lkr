<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{font-family: "Arial";
        background-color: #eee;
        }

        .detail{
            border : 2px solid black;
            background-color: white;
        }

        h1{color : darkgreen;
            font-size : 30px;
        }

        .book-info{
            border : 1px solid gray;
            background-color: #f9f9f9;
        }

        /* 너무 커서 이미지 사이즈 조절했습니다 */
        img{height: 200px;
            width: 200px;}

        /* 버튼 밑에 간격이 좀 보여서 MARGIN 추가 */
        input{margin-bottom: 20px;}
    </style>
</head>
<body>
    
    <h1>도서 상세 화면</h1>
    <div class = "detail">
        <img src = "images/book.jpg">

        <div class = "book-info">
        <h2>HTML 기초 입문</h2>
        <p>저자: 김코딩</p>
        <p>출판사: 웹북스</p>
        <p>대여 가능 여부 :대여 가능</p>
        </div>

        <div class = "book-detail">
        <h3>도서 설명</h3>
        <p>이 책은 HTML을 처음 배우는 학습자를 위한 입문서입니다.</p>
        <p>웹 페이지의 기본 구조와 태그 사용법을 쉽게 설명합니다.</p>
        <p>이미지, 링크, 목록, 표, 입력 요소를 단계적으로 학습할 수 있습니다.</p>
        </div>

        <div class = "borrow-or-not">
            <input type="button" value="대여하기"> <br>
            <a href = “book-list.html”>목록으로 돌아가기</a>
        </div>
    </div>
</body>
</html>
