<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;
        }

        header{
            display: flex;
            justify-content: space-between;
            background-color: black;
            padding: 24px;
            color: white;
            align-items: center;
        }

        .header-title{
            font-weight: 570;
        }

        .header-cart{
            background-color: rgb(53, 53, 255);
            padding: 8px 12px;
            border-radius: 16px;
            font-weight: 500;
        }

        .input-section{
            display: flex;
            gap: 12px;
            padding: 20px;
            border: 1px solid #ccc;
            justify-content: center;
            justify-self: center;
            min-width: 1200px;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.08);
        }
    
        .input-section__input{
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .input-section__type-selector{
            width: 150px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .item-section{
            width: 1200px;
        }

        .item__card-container{
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(4, 1fr);
        }

        .item__card{
            display: flex;
            flex-direction: column;
            background-color: white;
            border: 1px solid #ccc;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.08);

            transition: 0.3s;
        }

        .item__card:hover{
            transform: translateY(-5px);
        }
        
        .item__card-image{
            width: 100%;
            height: 180px;
            object-fit: cover;
            overflow: hidden;
        }

        .item__card-text{
            padding: 18px;
            display: flex;
            flex-direction: column;
        }

        .product-info h3{
            margin: 0 0 8px;
            font-size: 18px;
        }

        .brand{
            color: #6b7280;
            font-size: 14px;
        }

        .price{
            font-size: 22px;
            font-weight: bold;
            color: #2563eb;
        }

        .badge{
            display: inline-block;
            background-color: #dc2626;
            color: white;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 13px;
            margin-bottom: 8px;
        }

        button{
            width: 100%;
            border: none;
            background-color: #111827;

        }
    </style>
</head>
<body>

</body>
</html>
