<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // 배열이란?
        // 여러 개의 데이터를 효율적으로 관리하기 위한 자료구조

        // 배열을 생성하는 방법
        // 1. [] 리터럴 사용하기
        let arr = []; // 비어있는 배열 생성
        document.write('배열의 길이 : ', arr.length); // 0

        // 2. 생성자를 통한 생성
        let arr2 = Array(3);
        let arr3 = new Array(3);

        document.write("<br>");
        document.write("arr2 배열의 길이 : ", arr2.length); // 3

        // empty
        // 배열에 빈 칸을 표시할 때 사용하는 단어 - empty도 길이에 들어가는 취급

        // 배열에 요소 넣기
        arr[0] = 10;
        arr[1] = 20;
        arr[2] = 30;

        document.write("<br>");
        document.write(arr); // Arrays class에 toString이 이미 적용된 상태로 나온다.
        document.write(arr[0]);

        document.write("<br>");

        // 반복문으로 출력하기
        for(let i = 0; i < arr.length; i++){
            document.write(arr[i], "<br>");
        }

        // 배열에 포함된 메서드
        // 인덱스만으로는 불편하기 때문이다.
        arr = [10, 20, 30];
        // 마지막에 추가하고 싶은데 배열의 길이를 모른다면? arr.length를 쓰면 되지만
        // 정작 배열의 길이 자체를 모르는 상황은 동일함
        // 이로 인해 중간에 추가하거나 삭제를 하는 것은 좀 어려움이 있다.(끝을 모르기 때문)

        // pop() : 맨 뒤의 값을 삭제

        // unshift() : 맨 앞에 추가
        arr.unshift(0);
        document.write("<br>");
        document.write(arr);

        // shift() : 맨 앞에 있는 요소 삭제
        document.write("<br>");
        document.write(arr.shift(), "<br>"); // 0 -> 삭제한 값을 반환

        // slice() : 배열 자르기
        // 원본은 그대로 두고 일부만 복사
        arr = [10, 20, 30, 40, 50];
        let result = arr.slice(1, 4);
        document.write(result); // 20, 30, 40

        // splice(index, n, m) : 해당 인덱스부터 순서대로 n개의 요소 지우기 / 요소 m 추가
        arr = [10, 20, 30, 40];
        arr.splice(1,2);
        document.write("<br>");
        document.write(arr);

        arr.splice(1, 0, 100, 200, 300); // 여러 개도 가능
        document.write("<br>");
        document.write(arr);

        // 탐색과 포함여부 확인하는 메서드
        let names = ['kim', 'lee', 'park'];

        // includes : 요소를 포함하고 있으면 true, 아니면 false 반환
        document.write("<br>");
        document.write(names.includes('choi'));

        // find(조건) : 조건에 맞는 첫번째 값을 반환
        document.write("<br>");
        document.write([5, 10, 12, 15, 8].find(n => n > 10));

        // findIndex() : 위치 찾기
        document.write("<br>");
        document.write([5, 10, 12, 15, 8].findIndex(n => n > 10));

        // some() : 배열중에서 조건을 하나라도 만족하면 true(java : anyMatch)
        document.write("<br>");
        document.write([5, 10, 12, 15, 8].some(n => n > 10));

        // every() : 요소가 조건을 모두 만족하면 true(java : allMatch)
        document.write("<br>");
        document.write([5, 10, 12, 15, 8].every(n => n > 10));

        // 정렬과 뒤집기

        // sort((a,b) => (양수면 순서바꾸고 아니면 그대로)) -> a-b는 오름차순 정렬 / b-a는 내림차순 정렬
        document.write("<br>");
        document.write([10, 7, 9, 2, 6, 3, 1, 4, 5].sort((a,b) => a-b));
        
        // reverse() : 순서를 뒤집는다.
        document.write("<br>");
        document.write([10, 7, 9, 2, 6, 3, 1, 4, 5].reverse());

        // 스프레드 연산자
        // ...
        // 배열이나 객체의 값을 "펼쳐서" 복사하거나 전달할 때
        // 사용하는 문법

        document.write("<h3>스프레드 연산자</h3>");
        arr = [10, 20, 30];

        document.write(arr); // 배열의 요소를 하나의 문자열로 출력
        document.write("<br>");
        document.write(...arr); // 배열 안의 값을 하나씩 펼쳐서 출력

        // 스프레드 연산자 사용처

        // 1. 배열을 복사할 때 많이 사용
        let original = [1, 2, 3];
        let copy = [...original];
        document.write("<br>");
        document.write(copy);

        // 2. 배열 합칠 때 사용
        let front = [1,2];
        let back = [3,4];

        // 일반적인 합치기 : concat 사용
        result = front.concat(back);
        document.write("<br>");
        document.write(result);
        
        // 스프레드 이용한 합치기
        result = [...front, ...back];
        document.write("<br>");
        document.write(result);

    </script>
</head>
<body>
    
</body>
</html>
