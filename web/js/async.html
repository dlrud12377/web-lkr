<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>회원 목록</h1>
    <button id = "loadBtn">회원 불러오기</button>
    <div id = "result"></div>

    <h1>회원 추가하기</h1>
    <input id="name" placeholder="이름 입력"><br>
    <input id="email" placeholder="이메일 입력">
    <button id="saveBtn">회원 등록</button>

    <div ></div>
    <script>
        // 회원 목록

        let btn = document.getElementById("loadBtn");
        let result = document.getElementById("result");

        btn.addEventListener("click", () =>{
        fetch("https://jsonplaceholder.typicode.com/users")
        .then(response => response.json()) // 앞의 비동기 작업이 끝난 뒤 실행할 코드를 작성하는 메서드
        // json() : 서버 응답을 Javascript 객체나 배열로 바꿔준다.
        // status : 연결 상태코드
        // headers : 연결 정보
        // body : 데이터
        .then(users => {
            let html = "";
            for (let user of users){
                html += `
                <div>
                    <p>이름 : ${user.name} </p>
                    <p>이메일 : ${user.email}</p>
                    <hr>
                </div>
                `;
            }

            result.innerHTML = html;
            });
        })

        // 회원 추가하기

        // 버튼 눌렀을 때 값 가져오기

        let saveBtn = document.getElementById('saveBtn');

        saveBtn.addEventListener("click", () =>{
            let name = document.getElementById('name').value;
            let email = document.getElementById('email').value;

            // 둘 중 하나라도 입력하지 않았을 때
            // "모든 항목을 입력하세요" 경고 띄우기

            if( name == "" || email == "") {
                alert("모든 항목을 입력하세요");
                return;
            }

            // 내가 입력한 정보를 서버에 추가해달라고 요청
            fetch("https://jsonplaceholder.typicode.com/users", {
                method : "POST", // http 전송방식
                headers : { // 서버에게 내가 보내는 데이터는 json형식임을 알림
                    "Content-Type":"application/json"
                },
                // 전달하고자 하는 내용
                body : JSON.stringify({
                    name : name,
                    email : email
                })
            })
            .then(response => response.json())
            .then(user => {
                // 내가 추가한 사람의 이름과 이메일 div에 넣기
                result.innerHTML=`
                    <h3> 등록 결과 </h3>
                    <p> ID : ${user.id}</p>
                    <p> email : ${user.email}</p>
                    `;
            })
        });



        // 통신 : 브라우저와 서버가 데이터를 주고받는 것

        // 동기 통신 : 작업이 끝날때까지 기다리는 방식(기본 방식 - 코드를 앞에서부터 순서대로 실행)

        // 비동기 통신 : 기다리지 않고 다음 작업을 먼저 수행하는 방식

        // 왜 필요한가 ? 
        // 웹에서는 서버 응답이  오래걸릴 수 있다.

        // 예시

        // console.log("1");

        // // setTimeout() : 대표적인 비동기함수
        // setTimeout(() => {
        //     console.log("2");
        // }, 2000); // 2000ms = 2초

        // console.log("3");

        // 콘솔 상 1, 2, 3 순으로 보여져야 하지만, 비동기함수로 인해 2의 출력이 2초 후로 고정
        // 그래서 1,3이 출력되고 2초즈음 뒤에 2가 출력됨
        // 
        // fetch()함수
        // 서버에 요청을 보내는 함수
        // fetch(요청할 주소);
        // 비동기 함수이기 때문에 서버 응답을 기다리지 않고 다음코드를 실행한다.

        console.log("1. 요청 시작");
        // 응답이 도착한 후 실행할 코드를 따로 설정

        // 사이 코드 위쪽으로 이동함
        console.log("2. 요청 후 코드 실행")

        // async / await
        // async : 함수를 비동기로 만드는 키워드
        // await : 비동기 작업이 끝날 때까지 기다렸다가 다음 줄을 실행하세요
        const hello = async() => {
            const response = await fetch("url");
            const data = await response.json();
        };



        
    </script>
</body>
</html>
