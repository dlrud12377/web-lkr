<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="customer.js" defer></script>
    <link href="customer.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>고객센터 문의 등록</h1>
        <div class="post post-category">
            <p>문의 유형</p>
            <select id="selectCategory">
                <option value="null">===선택===</option>
                <option value="배송">배송</option>
                <option value="결제">결제</option>
            </select>
            <span id="categoryResult"></span>
        </div>

        <div class="post post-title">
            <p>제목</p>
            <input type="text" id="title" placeholder="5자 이상 30자 이하 입력">
            <span id="titleResult"></span>
        </div>

        <div class="post post-email">
            <p>이메일</p>
            <input type="text" id="email" placeholder="이메일을 입력하세요">
            <span id="emailResult"></span>
        </div>

        <div class="post post-content">
            <p>문의 내용</p>
            <textarea type="text" id="content" placeholder="20자 이상 300자 이하로 작성"></textarea>
            <span id="contentResult"></span>
        </div>

        <div class="checkbox-container">
            <input type="checkbox" id="checkbox">
            <span>개인정보 수집에 동의합니다.</span>
        </div>
        <button>문의 등록</button>
        <div class="post post-list">
            <h2>문의 목록</h2>
            <div class="post-card hidden">
                <p id="listCategory"></p>
                <p id="listTitle"></p>
                <p id="listEmail"></p>
                <p id="listContent"></p>
            </div>
        </div>
    </div>
</body>
</html>
