server:
  port: 10000

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/book_db
    driver-class-name: com.mysql.cj.jdbc.Driver
    username : root
    password : 12341234

mybatis:
  # SQL이 작성된 파일의 위치 classpath -> src/main/resources
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.book2.vo # vo의 경로 축약
  configuration:
    map-underscore-to-camel-case: true